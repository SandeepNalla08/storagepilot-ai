services:
  postgres:
    image: postgres:16
    container_name: storagepilot-postgres

    environment:
      POSTGRES_DB: storagepilot
      POSTGRES_USER: storagepilot
      POSTGRES_PASSWORD: storagepilot_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: